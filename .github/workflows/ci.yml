name: ci
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - run: pip install matplotlib numpy pandas pymupdf
      - run: python -m compileall -q .agents/skills scripts
      - run: python scripts/smoke_test.py
